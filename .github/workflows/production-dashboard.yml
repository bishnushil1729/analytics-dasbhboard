name: Production FE App Dashboard Update

on:
  # Daily at 2 AM UTC (7:30 AM IST)
  schedule:
    - cron: '0 2 * * *'

  # Manual trigger
  workflow_dispatch:

  # Trigger on push to main (for testing)
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '.github/workflows/production-dashboard.yml'

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Fail if takes longer than 30 minutes

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pandas plotly trino-python-client
      timeout-minutes: 5

    - name: Validate environment
      run: |
        echo "Python version: $(python --version)"
        echo "Pip version: $(pip --version)"
        echo "Workflow started at: $(date -u)"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"

    - name: Create data directory
      run: mkdir -p data

    - name: Run production dashboard generation
      id: generate-dashboard
      env:
        TRINO_PASSWORD: ${{ secrets.TRINO_PASSWORD }}
      run: |
        echo "Running production dashboard generation with error handling..."
        python production_wrapper.py

        # Extract metrics from status report
        if [ -f "production_status.json" ]; then
          cat production_status.json

          DASHBOARD_SIZE=$(python -c "import json; print(json.load(open('production_status.json')).get('dashboard_size', 0))")
          echo "dashboard_size=$DASHBOARD_SIZE" >> $GITHUB_OUTPUT

          # Get data row counts
          if [ -f "data/latest_hive_data.csv" ]; then
            TICKET_ROWS=$(wc -l < data/latest_hive_data.csv)
            echo "ticket_rows=$TICKET_ROWS" >> $GITHUB_OUTPUT
          fi

          if [ -f "data/latest_funnel_transformed.csv" ]; then
            FUNNEL_ROWS=$(wc -l < data/latest_funnel_transformed.csv)
            echo "funnel_rows=$FUNNEL_ROWS" >> $GITHUB_OUTPUT
          fi
        fi

        # Create index.html redirect
        if [ -f "simple_daily_dashboard_interactive.html" ]; then
          cp simple_daily_dashboard_interactive.html index.html
          echo "✅ Dashboard generated successfully"
        else
          echo "❌ Dashboard generation failed"
          exit 1
        fi
      timeout-minutes: 25

    - name: Create deployment metadata
      run: |
        cat > deployment-info.json << EOF
        {
          "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "workflow_run_id": "${{ github.run_id }}",
          "workflow_run_number": "${{ github.run_number }}",
          "triggered_by": "${{ github.event_name }}",
          "ticket_rows": "${{ steps.fetch-tickets.outputs.ticket_rows }}",
          "funnel_rows": "${{ steps.fetch-funnel.outputs.funnel_rows }}",
          "dashboard_size_bytes": "${{ steps.generate-dashboard.outputs.dashboard_size }}",
          "commit_sha": "${{ github.sha }}",
          "repository": "${{ github.repository }}"
        }
        EOF
        echo "✅ Deployment metadata created"

    - name: Validate HTML output
      run: |
        if ! grep -q "FE App Dashboard" simple_daily_dashboard_interactive.html; then
          echo "❌ Dashboard HTML appears invalid"
          exit 1
        fi
        echo "✅ Dashboard HTML validated"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
        publish_branch: gh-pages
        keep_files: false
        exclude_assets: '.github,*.py,*.md,data,*.pyc,__pycache__'
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy dashboard - ${{ github.event.head_commit.message || github.event_name }}'

    - name: Create deployment summary
      if: always()
      run: |
        echo "## 📊 Dashboard Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Data Statistics" >> $GITHUB_STEP_SUMMARY
        echo "- **Ticket rows:** ${{ steps.fetch-tickets.outputs.ticket_rows }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Funnel rows:** ${{ steps.fetch-funnel.outputs.funnel_rows }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Dashboard size:** ${{ steps.generate-dashboard.outputs.dashboard_size }} bytes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Dashboard URL" >> $GITHUB_STEP_SUMMARY
        echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY

    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Dashboard update failed!"
        echo "Check the logs above for details."
        echo "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Health check job (runs after deployment)
  health-check:
    needs: update-dashboard
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Wait for GitHub Pages deployment
      run: sleep 30

    - name: Check dashboard accessibility
      run: |
        DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "Checking dashboard at: $DASHBOARD_URL"

        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DASHBOARD_URL" || echo "000")

        if [ "$HTTP_CODE" = "200" ]; then
          echo "✅ Dashboard is accessible (HTTP $HTTP_CODE)"
        else
          echo "⚠️ Dashboard returned HTTP $HTTP_CODE"
          echo "Note: GitHub Pages may take a few minutes to update"
        fi

    - name: Create health check summary
      run: |
        echo "## 🏥 Health Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Dashboard URL:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** Deployment successful ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "_Note: GitHub Pages may take 2-3 minutes to fully update._" >> $GITHUB_STEP_SUMMARY
