name: Dashboard Health Monitor

on:
  # Check every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Manual trigger
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Check dashboard availability
      id: check-dashboard
      run: |
        DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "Checking dashboard at: $DASHBOARD_URL"

        # Check HTTP status
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DASHBOARD_URL" || echo "000")
        echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

        # Download and check content
        CONTENT=$(curl -s "$DASHBOARD_URL")

        # Check if dashboard contains expected content
        if echo "$CONTENT" | grep -q "FE App Dashboard"; then
          echo "content_check=pass" >> $GITHUB_OUTPUT
        else
          echo "content_check=fail" >> $GITHUB_OUTPUT
        fi

        # Check file size (should be > 100KB for full dashboard)
        SIZE=$(echo "$CONTENT" | wc -c)
        echo "dashboard_size=$SIZE" >> $GITHUB_OUTPUT

        if [ "$SIZE" -lt 100000 ]; then
          echo "size_check=fail" >> $GITHUB_OUTPUT
        else
          echo "size_check=pass" >> $GITHUB_OUTPUT
        fi

    - name: Check last update time
      run: |
        # Check when gh-pages branch was last updated
        LAST_COMMIT=$(curl -s "https://api.github.com/repos/${{ github.repository }}/branches/gh-pages" | jq -r '.commit.commit.author.date')
        echo "Last deployment: $LAST_COMMIT"

        # Calculate hours since last update
        LAST_EPOCH=$(date -d "$LAST_COMMIT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_COMMIT" +%s)
        NOW_EPOCH=$(date +%s)
        HOURS_AGO=$(( ($NOW_EPOCH - $LAST_EPOCH) / 3600 ))

        echo "Hours since last update: $HOURS_AGO"

        # Alert if dashboard hasn't updated in > 30 hours
        if [ "$HOURS_AGO" -gt 30 ]; then
          echo "⚠️ WARNING: Dashboard hasn't updated in $HOURS_AGO hours"
          echo "stale_warning=true" >> $GITHUB_OUTPUT
        else
          echo "✅ Dashboard is up to date"
          echo "stale_warning=false" >> $GITHUB_OUTPUT
        fi

    - name: Create monitoring report
      if: always()
      run: |
        echo "## 📊 Dashboard Health Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Status Checks" >> $GITHUB_STEP_SUMMARY
        echo "- **HTTP Status:** ${{ steps.check-dashboard.outputs.http_code }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Content Check:** ${{ steps.check-dashboard.outputs.content_check }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Size Check:** ${{ steps.check-dashboard.outputs.size_check }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Dashboard Size:** ${{ steps.check-dashboard.outputs.dashboard_size }} bytes" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ steps.check-dashboard.outputs.http_code }}" != "200" ] || \
           [ "${{ steps.check-dashboard.outputs.content_check }}" = "fail" ] || \
           [ "${{ steps.check-dashboard.outputs.size_check }}" = "fail" ]; then
          echo "**Overall Status:** ❌ UNHEALTHY" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "**Overall Status:** ✅ HEALTHY" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Alert on failure
      if: failure()
      run: |
        echo "🚨 ALERT: Dashboard health check failed!"
        echo "Dashboard URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "Action required: Check deployment workflow and dashboard status"
